# MP251 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G229"          # your group id, e.g. "G042"
problem_id: "MP251"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: null
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: null
    column: null           # the column recorded in a different unit
    group_value: null      # the value of area whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: null
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: null
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: null
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: null
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: null
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: mp251-rooftop-solar
  best_run_id: 558b5ca0501b4c7b97b550e260a0840e   # v1_final run of your v1 model
  registered_model_name: mp251-energy
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    panel_area_m2: null
    sunshine_hours: null
    temp_c: null
    dust_days: null
    panel_age_yr: null
    cloud_cover_pct: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of area
    'Old City': null
    'New Colony': null
    'Industrial': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
